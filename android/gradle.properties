# === Gradle memoria MUY contenida ===
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=128m -Dfile.encoding=UTF-8

# Evitar daemon para no reservar memoria en background
org.gradle.daemon=true

# Menos hilos = menos RAM
org.gradle.parallel=false
org.gradle.workers.max=2


# (recomendado en proyectos Flutter/AndroidX)
android.useAndroidX=true
android.enableJetifier=true

# Configuracion de Java
android.nonTransitiveRClass=false

org.gradle.java.home=C\:\\Program Files\\Java\\jdk-21



